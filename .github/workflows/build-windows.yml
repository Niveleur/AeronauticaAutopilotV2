name: Build Windows EXE

on:
  push:
    branches: [Standard]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: AeroHelper/requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r AeroHelper/requirements.txt
          python -m pip install pyinstaller==6.16.0
      - name: Test read-only aircraft HUD diagnostics
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYNPUT_BACKEND: dummy
        run: python scripts/run-tests.py
      - name: Record build identity
        shell: pwsh
        run: |
          @{ commit = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID } | ConvertTo-Json | Set-Content -Encoding utf8 build-info.json
      - name: Bundle standalone GUI application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name AeronauticaAutopilotV2 --add-data "build-info.json;." --collect-all easyocr --collect-all torch --collect-all torchvision --collect-submodules winsdk AeroHelper/main.py
      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/AeronauticaAutopilotV2/AeronauticaAutopilotV2.exe')) { throw 'EXE not found' }
      - name: Smoke test packaged Windows HUD window
        shell: pwsh
        run: ./scripts/test-windows-package.ps1 -PackageDirectory 'dist/AeronauticaAutopilotV2' -ReportPath "$env:RUNNER_TEMP/hud-smoke-local.json"
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: AeronauticaAutopilotV2-Windows-x64
          path: dist/AeronauticaAutopilotV2/
          if-no-files-found: error
          # NumPy 1.24 stores its required OpenBLAS DLL in numpy/.libs.
          # The uploader otherwise drops it even though local EXE tests pass.
          include-hidden-files: true
          retention-days: 30
      - name: Download the published package for round-trip validation
        uses: actions/download-artifact@v4
        with:
          name: AeronauticaAutopilotV2-Windows-x64
          path: ${{ runner.temp }}/aerohelper-downloaded
      - name: Verify the actual download opens the HUD window
        shell: pwsh
        run: ./scripts/test-windows-package.ps1 -PackageDirectory "$env:RUNNER_TEMP/aerohelper-downloaded" -ReportPath "$env:RUNNER_TEMP/hud-smoke-downloaded.json"
