name: Build Windows EXE

on:
  push:
    branches: [Standard]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: AeroHelper/requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r AeroHelper/requirements.txt
          python -m pip install pyinstaller==6.16.0
      - name: Test read-only aircraft HUD diagnostics
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYNPUT_BACKEND: dummy
        run: python -m unittest discover -s tests -v
      - name: Bundle standalone GUI application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name AeronauticaAutopilotV2 --collect-all easyocr --collect-all torch --collect-all torchvision --collect-submodules winsdk AeroHelper/main.py
      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/AeronauticaAutopilotV2/AeronauticaAutopilotV2.exe')) { throw 'EXE not found' }
      - name: Smoke test packaged Windows HUD window
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'hud-smoke.json'
          $exe = (Resolve-Path 'dist/AeronauticaAutopilotV2/AeronauticaAutopilotV2.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--hud-smoke-test', "`"$report`"") -PassThru
          if (!$process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Packaged HUD smoke test timed out'
          }
          if (!(Test-Path $report)) { throw 'Packaged HUD smoke report missing' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          Get-Content $report
          if ($process.ExitCode -ne 0 -or !$result.ok -or !$result.frozen) {
            throw 'Packaged Windows HUD smoke test failed'
          }
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: AeronauticaAutopilotV2-Windows-x64
          path: dist/AeronauticaAutopilotV2/
          if-no-files-found: error
          retention-days: 30
